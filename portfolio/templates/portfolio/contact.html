{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Contact | Apekshya Basnyat
    </title>

    <link
        rel="stylesheet"
        href="{% static 'portfolio/css/style.css' %}"
    >

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            Apekshya
        </div>


        <ul>

            <li>
                <a href="{% url 'home' %}">
                    Home
                </a>
            </li>


            <li>
                <a href="{% url 'about' %}">
                    About
                </a>
            </li>


            <li>
                <a href="{% url 'home' %}#skills">
                    Skills
                </a>
            </li>


            <li>
                <a href="{% url 'home' %}#projects">
                    Projects
                </a>
            </li>


            <li>
                <a href="{% url 'contact' %}">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- CONTACT FORM -->

    <section class="contact">

        <h1 class="section-title">
            Contact Me
        </h1>


        <p>
            Have a question, opportunity, or
            just want to connect?
        </p>


        <form
            method="POST"
            class="contact-form"
        >

            {% csrf_token %}


            {{ form.as_p }}


            <button
                type="submit"
                class="button"
            >
                Send Message
            </button>

        </form>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Apekshya Basnyat.
            All Rights Reserved.
        </p>

    </footer>


</body>

</html>
